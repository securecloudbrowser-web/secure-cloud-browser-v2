# Keep-alive pinger — stops free-host "sleep when idle" from triggering.
#
# How it works: DockHosting free sleeps an app that gets NO traffic.
# This GitHub Actions schedule sends one tiny HTTP request to the app
# every 5 minutes, so the app always looks "visited" and never idles.
# The pinger MUST live outside the app (a stopped app cannot ping itself).
#
# SETUP (one line, after the DockHosting deploy gives the app its URL):
#   Replace the APP_URL value below with the real app address, e.g.
#   https://my-browser.dockhosting.dev
# Until then the ping targets a placeholder and simply does nothing
# harmful (failures are ignored on purpose).
#
# Honest limits:
# - GitHub schedules can drift a few minutes; if the host's idle limit
#   is very short, add UptimeRobot (free, 5-min pings) as a second layer.
# - GitHub auto-disables scheduled workflows in public repos after
#   ~60 days without repo activity; any commit re-enables them.
# - If the host's terms forbid keep-alive traffic, the app may still be
#   slept by the platform — this is a workaround, not a guarantee.

name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app so it never looks idle
        run: |
          APP_URL="https://YOUR-APP.dockhosting.dev"
          echo "Pinging $APP_URL"
          curl -s -o /dev/null -m 30 -A "Mozilla/5.0 (keep-alive)" "$APP_URL" || true
